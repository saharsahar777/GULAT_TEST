<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Карта</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: fixed;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            background: #f5f5f5;
        }

        #map {
            width: 100%;
            height: 100%;
            position: relative;
            touch-action: pan-x pan-y;
        }

        .leaflet-container {
            height: 100%;
            width: 100%;
            background: #e5e5e5;
        }

        /* Кнопки зума слева сверху */
        .zoom-controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .zoom-btn {
            width: 50px;
            height: 50px;
            background: none;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(139, 122, 184, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            padding: 0;
        }

        .zoom-btn img {
            width: 50px;
            height: 50px;
            display: block;
        }

        .zoom-btn:active {
            transform: scale(0.95);
        }

        /* Большая кнопка "Гулять" внизу по центру */
        .walk-main-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 70px;
            height: 70px;
            background: none;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(139, 122, 184, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s ease;
            padding: 0;
        }

        .walk-main-btn img {
            width: 70px;
            height: 70px;
            display: block;
            transition: all 0.5s ease;
        }

        /* Состояние после нажатия - кнопка уменьшается и перемещается вправо */
        .walk-main-btn.moved {
            width: 50px;
            height: 50px;
            right: 88px;
            left: auto;
            transform: translateX(0);
        }

        .walk-main-btn.moved img {
            width: 50px;
            height: 50px;
        }

        .walk-main-btn:active {
            transform: translateX(-50%) scale(0.95);
        }

        .walk-main-btn.moved:active {
            transform: scale(0.95);
        }

        .walk-main-btn.loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .walk-icon {
            width: 30px;
            height: 30px;
            fill: white;
            transition: all 0.5s ease;
        }

        .walk-main-btn.moved .walk-icon {
            width: 24px;
            height: 24px;
        }

        /* Кнопка геолокации справа внизу */
        .location-main-btn {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 1000;
            width: 50px;
            height: 50px;
            background: none;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(139, 122, 184, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            padding: 0;
        }

        .location-main-btn img {
            width: 50px;
            height: 50px;
            display: block;
        }

        .location-main-btn:active {
            transform: scale(0.95);
        }

        .location-main-btn.loading {
            opacity: 0.6;
            pointer-events: none;
        }

        /* Кнопка "Я на месте" */
        .arrived-btn {
            position: fixed;
            bottom: 30px;
            left: 20px;
            z-index: 1000;
            background: #90EE90;
            color: #2d5016;
            border: none;
            border-radius: 12px;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(144, 238, 144, 0.4);
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.5s ease;
        }

        .arrived-btn.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .arrived-btn:active {
            transform: scale(0.95);
            background: #7CD67C;
        }

        .arrived-btn.show:active {
            transform: translateY(0) scale(0.95);
        }

        /* Иконка галочки в кнопке */
        .check-icon {
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideOutDown {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(20px);
            }
        }

        .arrived-btn:active {
            transform: scale(0.95);
            background: #7CD67C;
        }

        .toast {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 24px;
            z-index: 10000;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            max-width: 80%;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
        }

        /* Модальное окно */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 10001;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 320px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            animation: modalSlideIn 0.3s ease-out;
        }

        @keyframes modalSlideIn {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-content h2 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #8B7AB8;
            text-align: center;
        }

        .modal-content p {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.5;
        }

        .modal-btn {
            width: 100%;
            padding: 14px;
            background: #8B7AB8;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-btn:active {
            transform: scale(0.98);
            background: #7B6AA8;
        }

        .error-text {
            color: #ff4444;
        }

        /* Скрываем стандартные кнопки Leaflet */
        .leaflet-control-zoom {
            display: none;
        }

        .leaflet-popup-content-wrapper {
            border-radius: 12px;
        }

        .leaflet-popup-content {
            margin: 12px;
            font-size: 14px;
        }

        /* Исправление отображения кастомного маркера */
        .custom-destination-icon {
            background: transparent !important;
            border: none !important;
        }
        
        .custom-destination-icon div {
            position: relative;
        }
    </style>
</head>
<body>
    <!-- Кнопки зума -->
    <div class="zoom-controls">
        <button class="zoom-btn" onclick="zoomIn()">
            <img src="plus button.png" alt="+" width="50" height="50">
        </button>
        <button class="zoom-btn" onclick="zoomOut()">
            <img src="minus button.png" alt="-" width="50" height="50">
        </button>
    </div>

    <div id="map"></div>

    <!-- Большая кнопка "Гулять" -->
    <button class="walk-main-btn" id="walkBtn" onclick="startWalk()">
        <img src="walk button.png" alt="Гулять" width="70" height="70">
    </button>

    <!-- Кнопка геолокации -->
    <button class="location-main-btn" id="locationBtn" onclick="getMyLocation()">
        <img src="location button.png" alt="Геолокация" width="50" height="50">
    </button>

    <!-- Кнопка "Я на месте" -->
    <button class="arrived-btn" id="arrivedBtn" onclick="checkArrival()">
        <span class="check-icon">✓</span>
        Я на месте
    </button>

    <div class="toast" id="toast"></div>

    <!-- Модальное окно -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modalTitle">🎉 Поздравляем!</h2>
            <p id="modalText">Вы добрались до конечной точки маршрута.</p>
            <button class="modal-btn" id="modalBtn" onclick="closeModalAndWalk()">🚶 Гулять ещё</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        let map;
        let markers = [];
        let currentLocationMarker = null;
        let walkDestinationMarker = null;
        let walkRouteLine = null;
        let userLocation = null;

        // Показать уведомление
        function showToast(message, duration = 3000) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        // Инициализация карты после загрузки DOM
        document.addEventListener('DOMContentLoaded', function() {
            try {
                // Инициализация карты (центр - Варшава)
                map = L.map('map', {
                    zoomControl: false, // Убираем стандартные кнопки зума
                    attributionControl: false, // Убираем атрибуцию
                    tap: true,
                    touchZoom: true,
                    dragging: true
                }).setView([52.2297, 21.0122], 13);

                // Добавление слоя 2GIS
                L.tileLayer('https://tile2.maps.2gis.com/tiles?x={x}&y={y}&z={z}&v=1', {
                    maxZoom: 19,
                    minZoom: 3
                }).addTo(map);

                // Добавление начальной метки
                const initialMarker = L.marker([52.2297, 21.0122]).addTo(map);
                initialMarker.bindPopup('<b>Варшава</b><br>Столица Польши');
                markers.push(initialMarker);

                console.log('✅ Карта успешно инициализирована');
                
                // Попытка автоматически определить местоположение при запуске
                setTimeout(() => {
                    getMyLocation(true);
                }, 1000);
                
            } catch (error) {
                console.error('❌ Ошибка инициализации карты:', error);
                showToast('Ошибка загрузки карты');
            }
        });

        // Функции зума
        function zoomIn() {
            map.zoomIn();
        }

        function zoomOut() {
            map.zoomOut();
        }

        // Функция получения текущего местоположения
        function getMyLocation(silent = false) {
            if (!navigator.geolocation) {
                if (!silent) showToast('Геолокация не поддерживается');
                return;
            }

            const btn = document.getElementById('locationBtn');
            btn.classList.add('loading');
            // Не меняем содержимое кнопки, оставляем SVG иконку

            const options = {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            };

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = position.coords.accuracy;
                    
                    map.setView([lat, lon], 15);
                    
                    // Удаляем предыдущий маркер текущего местоположения
                    if (currentLocationMarker) {
                        map.removeLayer(currentLocationMarker);
                    }
                    
                    // Создаем специальный маркер для текущего местоположения
                    currentLocationMarker = L.circleMarker([lat, lon], {
                        radius: 10,
                        fillColor: '#4285F4',
                        color: '#ffffff',
                        weight: 3,
                        opacity: 1,
                        fillOpacity: 0.8
                    }).addTo(map);
                    
                    // Добавляем круг точности
                    L.circle([lat, lon], {
                        radius: accuracy,
                        fillColor: '#4285F4',
                        fillOpacity: 0.1,
                        color: '#4285F4',
                        weight: 1
                    }).addTo(map);
                    
                    currentLocationMarker.bindPopup(`<b>Вы здесь!</b><br>Точность: ${Math.round(accuracy)}м`).openPopup();
                    
                    // Сохраняем текущее местоположение
                    userLocation = {lat: lat, lon: lon};
                    
                    btn.classList.remove('loading');
                    
                    if (!silent) showToast('Местоположение определено');
                },
                (error) => {
                    console.error('Ошибка геолокации:', error);
                    btn.classList.remove('loading');
                    
                    if (!silent) {
                        let errorMessage = '';
                        
                        switch(error.code) {
                            case error.PERMISSION_DENIED:
                                errorMessage = 'Доступ к геолокации запрещен. Разрешите доступ в настройках.';
                                break;
                            case error.POSITION_UNAVAILABLE:
                                errorMessage = 'Местоположение недоступно. Проверьте GPS.';
                                break;
                            case error.TIMEOUT:
                                errorMessage = 'Превышено время ожидания.';
                                break;
                            default:
                                errorMessage = 'Ошибка получения местоположения.';
                        }
                        
                        showToast(errorMessage, 4000);
                    }
                },
                options
            );
        }

        // Функция "Гулять" - генерирует случайную точку
        function startWalk() {
            if (!userLocation) {
                showToast('Сначала определите своё местоположение');
                // Пытаемся определить местоположение
                getMyLocation();
                return;
            }

            const walkBtn = document.getElementById('walkBtn');
            walkBtn.classList.add('loading');
            // Не меняем содержимое кнопки, оставляем SVG иконку

            // Удаляем предыдущий маршрут
            if (walkDestinationMarker) {
                map.removeLayer(walkDestinationMarker);
                walkDestinationMarker = null;
            }
            if (walkRouteLine) {
                map.removeLayer(walkRouteLine);
                walkRouteLine = null;
            }
            
            // Дополнительная очистка: удаляем все старые маркеры из DOM на всякий случай
            const oldMarkers = document.querySelectorAll('.custom-destination-icon');
            oldMarkers.forEach(marker => {
                if (marker.parentElement) {
                    marker.parentElement.remove();
                }
            });

            // Генерируем случайную точку в радиусе 500-2000 метров
            const minDistance = 500; // минимум 500 метров
            const maxDistance = 2000; // максимум 2 км
            const distance = minDistance + Math.random() * (maxDistance - minDistance);
            const angle = Math.random() * 2 * Math.PI;

            // Вычисляем новые координаты (примерно 111км = 1 градус)
            const deltaLat = (distance / 111000) * Math.cos(angle);
            const deltaLon = (distance / (111000 * Math.cos(userLocation.lat * Math.PI / 180))) * Math.sin(angle);

            const destinationLat = userLocation.lat + deltaLat;
            const destinationLon = userLocation.lon + deltaLon;

            console.log('Пользователь:', userLocation.lat, userLocation.lon);
            console.log('Точка назначения:', destinationLat, destinationLon);

            // Сохраняем координаты назначения для кнопки маршрута
            window.walkDestination = {
                lat: destinationLat,
                lon: destinationLon
            };

            // Создаём маркер назначения
            walkDestinationMarker = L.marker([destinationLat, destinationLon], {
                icon: L.divIcon({
                    className: 'custom-destination-icon',
                    html: '<div style="background: #ff4444; width: 30px; height: 30px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; font-size: 16px;">🎯</div>',
                    iconSize: [30, 30],
                    iconAnchor: [15, 15]
                })
            }).addTo(map);
            
            console.log('Маркер создан:', walkDestinationMarker);
            console.log('Маркер на карте:', map.hasLayer(walkDestinationMarker));

            // Вычисляем реальное расстояние
            const actualDistance = calculateDistance(
                userLocation.lat, userLocation.lon,
                destinationLat, destinationLon
            );

            // Добавляем кнопки выбора карт в popup (popup нельзя закрыть)
            walkDestinationMarker.bindPopup(
                `<b>🎯 Точка назначения</b><br>` +
                `Расстояние: ~${Math.round(actualDistance)}м<br>` +
                `Время: ~${Math.round(actualDistance / 80)} мин<br>` +
                `<div style="margin-top: 10px; display: flex; flex-direction: column; gap: 6px;">` +
                `<button onclick="openRoute('yandex')" style="padding: 8px 12px; background: #FC3F1D; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500;">🗺️ Яндекс.Карты</button>` +
                `<button onclick="openRoute('2gis')" style="padding: 8px 12px; background: #31AC45; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500;">🗺️ 2GIS</button>` +
                `<button onclick="openRoute('google')" style="padding: 8px 12px; background: #4285F4; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500;">🗺️ Google Maps</button>` +
                `</div>`,
                {
                    closeButton: false, // Убираем кнопку закрытия
                    closeOnClick: false, // Не закрывается при клике на карту
                    autoClose: false // Не закрывается автоматически
                }
            ).openPopup();

            // Рисуем линию маршрута
            const lineCoords = [
                [userLocation.lat, userLocation.lon],
                [destinationLat, destinationLon]
            ];
            console.log('Координаты линии:', lineCoords);
            
            walkRouteLine = L.polyline(lineCoords, {
                color: '#ff4444',
                weight: 4,
                opacity: 0.8,
                dashArray: '10, 10'
            }).addTo(map);

            // Центрируем карту чтобы показать оба маркера
            const bounds = L.latLngBounds(
                [userLocation.lat, userLocation.lon],
                [destinationLat, destinationLon]
            );
            map.fitBounds(bounds, { padding: [50, 50] });

            walkBtn.classList.remove('loading');

            showToast(`Цель: ${Math.round(actualDistance)}м от вас!`);
            
            // Плавное перемещение кнопок без размытия (только при первом нажатии)
            if (!walkBtn.classList.contains('moved')) {
                // Перемещаем кнопку "Гулять" вправо и уменьшаем
                walkBtn.classList.add('moved');
                
                // Показываем кнопку "Я на месте"
                document.getElementById('arrivedBtn').classList.add('show');
            }
        }

        // Функция проверки прибытия на место
        function checkArrival() {
            if (!userLocation || !window.walkDestination) {
                showToast('Сначала создайте маршрут');
                return;
            }

            // Получаем текущее местоположение для проверки
            if (!navigator.geolocation) {
                showToast('Геолокация не поддерживается');
                return;
            }

            const arrivedBtn = document.getElementById('arrivedBtn');
            const originalText = arrivedBtn.textContent;
            arrivedBtn.textContent = '⏳ Проверка...';
            arrivedBtn.style.pointerEvents = 'none';

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const currentLat = position.coords.latitude;
                    const currentLon = position.coords.longitude;
                    
                    // Вычисляем расстояние до точки назначения
                    const distance = calculateDistance(
                        currentLat, currentLon,
                        window.walkDestination.lat, window.walkDestination.lon
                    );

                    arrivedBtn.textContent = originalText;
                    arrivedBtn.style.pointerEvents = 'auto';

                    if (distance <= 25) {
                        // Успех! Пользователь на месте
                        showSuccessModal();
                    } else {
                        // Слишком далеко
                        showErrorModal(Math.round(distance));
                    }
                },
                (error) => {
                    arrivedBtn.textContent = originalText;
                    arrivedBtn.style.pointerEvents = 'auto';
                    showToast('Не удалось определить местоположение');
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // Показать модальное окно успеха
        function showSuccessModal() {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modalTitle');
            const text = document.getElementById('modalText');
            const btn = document.getElementById('modalBtn');
            
            title.textContent = '🎉 Поздравляем!';
            title.className = '';
            text.textContent = 'Вы добрались до конечной точки маршрута.';
            text.className = '';
            btn.textContent = '🚶 Гулять ещё';
            btn.onclick = closeModalAndWalk;
            
            modal.classList.add('show');
        }

        // Показать модальное окно ошибки
        function showErrorModal(distance) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modalTitle');
            const text = document.getElementById('modalText');
            const btn = document.getElementById('modalBtn');
            
            title.textContent = '📍 Слишком далеко';
            title.className = 'error-text';
            text.textContent = `Вы слишком далеко от конечной точки маршрута. Подойдите ближе (осталось ${distance}м).`;
            text.className = 'error-text';
            btn.textContent = 'Понятно';
            btn.onclick = closeModal;
            
            modal.classList.add('show');
        }

        // Закрыть модальное окно
        function closeModal() {
            document.getElementById('modal').classList.remove('show');
        }

        // Закрыть модальное окно и начать новую прогулку
        function closeModalAndWalk() {
            closeModal();
            // Скрываем кнопку "Я на месте"
            document.getElementById('arrivedBtn').classList.remove('show');
            // Возвращаем кнопку "Гулять" в центр
            document.getElementById('walkBtn').classList.remove('moved');
            // Запускаем новую прогулку
            startWalk();
        }

        // Функция открытия маршрута в выбранных картах телефона
        function openRoute(mapType) {
            if (!userLocation || !window.walkDestination) {
                showToast('Сначала создайте маршрут');
                return;
            }

            const start = `${userLocation.lat},${userLocation.lon}`;
            const end = `${window.walkDestination.lat},${window.walkDestination.lon}`;
            
            let url;
            let mapName;

            switch(mapType) {
                case 'yandex':
                    url = `https://yandex.ru/maps/?rtext=${start}~${end}&rtt=pd`;
                    mapName = 'Яндекс.Картах';
                    break;
                case '2gis':
                    url = `https://2gis.ru/routeSearch/rsType/pedestrian/from/${userLocation.lon},${userLocation.lat}/to/${window.walkDestination.lon},${window.walkDestination.lat}`;
                    mapName = '2GIS';
                    break;
                case 'google':
                default:
                    url = `https://www.google.com/maps/dir/?api=1&origin=${start}&destination=${end}&travelmode=walking`;
                    mapName = 'Google Maps';
                    break;
            }
            
            // Открываем выбранную карту
            window.open(url, '_blank');
            
            showToast(`Маршрут открыт в ${mapName}`);
        }

        // Функция вычисления расстояния между двумя точками (формула Гаверсина)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000; // Радиус Земли в метрах
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Предотвращаем масштабирование двойным тапом
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(event) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
